<text font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="998.0" y="579.0">ALTERNATE BATCH ENTRY POINT</tspan><tspan x="998.0" y="593.0">Plan a Sprint — /ui/plan-sprint</tspan><tspan x="998.0" y="607.0"></tspan><tspan x="998.0" y="621.0">Batch-plans several BRD+sprint-tagged</tspan><tspan x="998.0" y="635.0">pages at once: predicts routing labels</tspan><tspan x="998.0" y="649.0">and cross-page dependencies, writes the</tspan><tspan x="998.0" y="663.0">order as real Jira issue links</tspan><tspan x="998.0" y="677.0">(jira/sprint_planner.py), then feeds</tspan><tspan x="998.0" y="691.0">each page's story through this same</tspan><tspan x="998.0" y="705.0">approval gate and pipeline one at a</tspan><tspan x="998.0" y="719.0">time, merge-gated by</tspan><tspan x="998.0" y="733.0">pipeline/sprint_runner.py.</tspan></text>
