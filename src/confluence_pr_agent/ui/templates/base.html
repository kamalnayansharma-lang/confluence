<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driftbridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;500;600;700&family=Gabarito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Neurealm Design System (brand migration, token-only swap -- see
       Neurealm Design System Guidelines.pdf / desing-system-plugin) --
       every hex below is a real token from PRIMITIVE.md/LIGHT_SCHEMES.md,
       not an invented value. Variable NAMES are unchanged from the
       pre-migration theme on purpose: every component below already
       reads through these names via var(--x), so swapping only the
       values here re-skins the whole app without touching a single
       component rule -- exactly the "master theme settings" swap the
       guide's Step 5 (non-destructive theme layer mutation) describes.
       Two exceptions, both judgment calls made explicit rather than
       applying a technically-correct-but-wrong-looking token literally:
        - --border uses the Grey-200 primitive, not the "Outline Variant"
          semantic alias -- that alias resolves to #6D717F, a mid-grey far
          too dark for a 1px hairline row/card border.
        - --success/--error/--warning use the provided flat scale steps
          (e.g. Success-100/800/300) instead of re-deriving alpha-mixed
          rgba() tints, since the design system already hands us discrete
          steps for exactly this bg/text/border triad shape. */
    --header-bg: #DDE1FF;    /* Primary-200 */
    --bg: #F1F0FF;           /* Schemes/Background = Primary-100 */
    --bg-elevated: #FFFFFF;  /* Surface Container Lowest */
    --bg-elevated-2: #F3F4F6; /* Grey-100, Surface Container */
    --border: #E5E7EA;       /* Grey-200 -- see note above */
    --text: #131927;         /* Grey-900, Schemes/On Background */
    --text-muted: #6D717F;   /* Grey-500 */
    --accent: #081160;       /* Primary-900, Schemes/Primary */
    --accent-rgb: 8, 17, 96;       /* same value as --accent, comma-separated for rgba() mixes below */
    --accent-hover: #202B81; /* Primary-800 */
    --accent-blue: #3182CE;  /* Secondary-600 */
    --accent-blue-rgb: 49, 130, 206; /* same value as --accent-blue, comma-separated for rgba() mixes below */
    --success-bg: #E9F1EC;   /* Success-100 */
    --success-text: #1D6336; /* Success-800 */
    --success-border: #A1E2B9; /* Success-300 */
    --error-bg: #F2E9E9;     /* Error-100 */
    --error-text: #931616;   /* Error-700 */
    --error-border: #E89B9B; /* Error-300 */
    --neutral-bg: #F3F4F6;   /* Grey-100 */
    --neutral-text: #4D5461; /* Grey-600 */
    --warning-bg: #F2EEDF;   /* Warning-100 */
    --warning-text: #6E4B12; /* Warning-800 */
    --warning-border: #EFB552; /* Warning-400 */
    /* Dual-font track (TYPOGRAPHY.md): Exo for headers/dashboard-level
       content, Gabarito for dense tabular/technical panes -- this app is
       mostly the latter (run history tables, config forms, diff views),
       so most of the page actually reads in the secondary track. */
    --font-primary: 'Exo', system-ui, -apple-system, sans-serif;
    --font-secondary: 'Gabarito', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html { background: var(--bg); }

  body {
    font-family: var(--font-primary);
    margin: 0;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
  }

  /* Secondary-Gabarito track -- technical side panes, data grids, tabular
     layouts, form inputs (see TYPOGRAPHY.md's Do's). Headings/nav/brand
     stay on the primary Exo track (body's default), inherited as normal. */
  table, input, select, code, .hint {
    font-family: var(--font-secondary);
  }

  /* Full-bleed header band -- edge to edge across the viewport, visually
     distinct from the page content beneath it. The centered 1000px column
     lives inside .topband-inner and .page respectively, not on body itself,
     so the two tones can each span the full browser width behind their own
     content. */
  .topband {
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
  }
  .topband-inner {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }
  .page {
    max-width: 1000px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(var(--accent-blue-rgb), 0.05), transparent 60%),
      radial-gradient(ellipse 700px 400px at 100% 0%, rgba(var(--accent-rgb), 0.045), transparent 55%);
    background-attachment: fixed;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 1.75rem 0 1.25rem;
  }
  .brand-mark { flex-shrink: 0; }
  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }
  .brand-name {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1;
    color: var(--text);
  }
  .brand-tagline {
    font-size: 0.8rem;
    font-weight: 500;
    line-height: 1;
    color: var(--text-muted);
  }

  nav {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding-bottom: 1rem;
  }
  nav a {
    text-decoration: none;
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.9rem;
    padding: 0.7rem 0.9rem;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease;
  }
  nav a:hover { color: var(--text); }
  nav a.active { color: var(--text); border-bottom-color: var(--accent); }

  h1 { margin-bottom: 0.25rem; font-weight: 700; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-muted); margin-top: 0; margin-bottom: 1.75rem; font-size: 0.95rem; line-height: 1.5; }

  .tab-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .tab-btn {
    background: transparent;
    color: var(--text-muted);
    border: none;
    border-radius: 0;
    border-bottom: 2px solid transparent;
    padding: 0.65rem 0.9rem;
    font-size: 0.88rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .tab-btn:hover { background: transparent; color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

  fieldset {
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    border-radius: 12px;
    margin-bottom: 1.5rem;
    padding: 1.1rem 1.4rem 1.4rem;
  }
  fieldset.tab-panel { display: none; }
  fieldset.tab-panel.active { display: block; }
  legend {
    font-weight: 600;
    padding: 0 0.5rem;
    color: var(--text);
    font-size: 0.95rem;
  }

  label { display: block; margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

  input, select {
    width: 100%;
    padding: 0.55rem 0.75rem;
    margin-top: 0.35rem;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 0.9rem;
    /* font-family intentionally NOT set here -- the earlier
       table/input/select/code/.hint rule already puts these on the
       Secondary-Gabarito track; redeclaring `inherit` here would win the
       cascade (same specificity, declared later) and silently undo it. */
  }
  input::placeholder { color: #a6aac8; }
  input:focus, select:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(var(--accent-blue-rgb), 0.18); }
  select { appearance: none; }

  .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.3rem; line-height: 1.4; }
  .set-badge { color: var(--success-text); font-size: 0.75rem; font-weight: 600; margin-left: 0.4rem; }

  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.7rem 1.6rem;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: scale(0.98); }

  .btn-danger {
    background: transparent;
    border: 1px solid var(--error-border);
    color: var(--error-text);
    padding: 0.35rem 0.8rem;
    font-size: 0.76rem;
    font-weight: 600;
    border-radius: 6px;
  }
  .btn-danger:hover { background: var(--error-bg); }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.45rem 0.9rem;
    font-size: 0.82rem;
    font-weight: 600;
    border-radius: 6px;
  }
  .btn-secondary:hover { background: rgba(35, 38, 69, 0.05); color: var(--text); }

  /* Deliberately distinct from .btn-secondary (used by "Add repo", "Detect",
     "Load from .env file" right next to it) -- a credential check reads as
     an action worth noticing, not one more neutral utility button, so it
     gets its own color and a bolt icon rather than blending into the row. */
  .btn-test-connection {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(var(--accent-blue-rgb), 0.10);
    border: 1px solid rgba(var(--accent-blue-rgb), 0.5);
    color: var(--accent-blue);
    padding: 0.45rem 0.9rem 0.45rem 0.7rem;
    font-size: 0.82rem;
    font-weight: 600;
    border-radius: 6px;
  }
  .btn-test-connection:hover { background: rgba(var(--accent-blue-rgb), 0.2); color: var(--accent-blue); }
  .btn-test-connection::before {
    content: "";
    width: 13px;
    height: 13px;
    flex: none;
    background-color: currentColor;
    -webkit-mask: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polygon points='13,2 4,14 11,14 9,22 20,10 13,10'/></svg>") no-repeat center / contain;
    mask: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polygon points='13,2 4,14 11,14 9,22 20,10 13,10'/></svg>") no-repeat center / contain;
  }

  .taglist-editor { margin-top: 0.35rem; }
  .taglist-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; min-height: 1.6rem; }
  .taglist-empty { font-size: 0.8rem; color: var(--text-muted); font-style: italic; }
  .taglist-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: rgba(var(--accent-blue-rgb), 0.12);
    border: 1px solid rgba(var(--accent-blue-rgb), 0.32);
    color: var(--accent-blue);
    padding: 0.2rem 0.3rem 0.2rem 0.65rem;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .taglist-chip-remove {
    background: none;
    border: none;
    color: inherit;
    padding: 0;
    width: 18px;
    height: 18px;
    line-height: 1;
    border-radius: 50%;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .taglist-chip-remove:hover { background: rgba(var(--accent-blue-rgb), 0.22); }
  .taglist-add-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .taglist-add-row .taglist-input { margin-top: 0; flex: 1; }
  .taglist-add-row .taglist-add-btn { flex-shrink: 0; }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 1rem;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
  }
  .filter-field { display: flex; flex-direction: column; min-width: 140px; }
  .filter-field label { margin-top: 0; margin-bottom: 0.2rem; }
  .filter-field input, .filter-field select { margin-top: 0; }
  .filter-actions { flex-direction: row; align-items: center; gap: 0.75rem; min-width: 0; }
  .filter-actions button { padding: 0.55rem 1.3rem; }
  .filter-actions a { font-size: 0.85rem; color: var(--text-muted); }
  .filter-actions a:hover { color: var(--text); }

  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.65rem 0.7rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: top; }
  th { color: var(--text-muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
  tbody tr:hover { background: rgba(35, 38, 69, 0.03); }

  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .badge-opened_pr { background: var(--success-bg); color: var(--success-text); border-color: var(--success-border); }
  .badge-tests_failed { background: var(--error-bg); color: var(--error-text); border-color: var(--error-border); }
  .badge-judge_rejected { background: var(--error-bg); color: var(--error-text); border-color: var(--error-border); }
  .badge-error { background: var(--error-bg); color: var(--error-text); border-color: var(--error-border); }
  .badge-no_change_detected { background: var(--neutral-bg); color: var(--neutral-text); }
  .badge-ignored { background: var(--neutral-bg); color: var(--neutral-text); }
  .badge-no_repo_matched { background: var(--neutral-bg); color: var(--neutral-text); }
  .badge-awaiting_approval { background: var(--warning-bg); color: var(--warning-text); border-color: var(--warning-border); }
  .badge-no_changes { background: var(--neutral-bg); color: var(--neutral-text); }
  .badge-warning { background: var(--warning-bg); color: var(--warning-text); border-color: var(--warning-border); }
  .badge-running {
    background: rgba(var(--accent-blue-rgb), 0.12);
    color: var(--accent-blue);
    border-color: rgba(var(--accent-blue-rgb), 0.35);
    animation: pulse-running 1.6s ease-in-out infinite;
  }
  @keyframes pulse-running {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .flow {
    display: flex;
    align-items: flex-start;
    overflow-x: auto;
    padding: 0.75rem 0.25rem 0.25rem;
  }
  .flow-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
    width: 118px;
    text-align: center;
  }
  .flow-node {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-muted);
    font-weight: 700;
    font-size: 0.9rem;
  }
  .flow-step--done .flow-node { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  .flow-step--active .flow-node { background: rgba(var(--accent-blue-rgb), 0.14); border-color: rgba(var(--accent-blue-rgb), 0.5); color: var(--accent-blue); animation: pulse-running 1.6s ease-in-out infinite; }
  .flow-step--failed .flow-node { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
  .flow-step--warning .flow-node { background: var(--warning-bg); border-color: var(--warning-border); color: var(--warning-text); }
  .flow-step--skipped .flow-node { background: var(--neutral-bg); border-color: transparent; color: var(--neutral-text); }
  /* A not-yet-reached step's .flow-node otherwise falls back to the base
     rule (background: var(--bg-elevated) -- pure white, same as the card
     behind it), so on a still-running page the not-yet-reached half of the
     row reads as visually empty against the colored done/active steps
     beside it, even though the row itself is perfectly centered. Same
     neutral tint already used for --skipped and neutral badges, not a new
     color, just enough presence that pending steps don't disappear. */
  .flow-step--pending .flow-node { background: var(--neutral-bg); }
  .flow-pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-blue); }
  .flow-label { margin-top: 0.55rem; font-size: 0.78rem; font-weight: 600; color: var(--text); line-height: 1.3; }
  .flow-step--skipped .flow-label, .flow-step--pending .flow-label { color: var(--text-muted); font-weight: 500; }
  .flow-detail { margin-top: 0.15rem; font-size: 0.7rem; color: var(--text-muted); line-height: 1.3; word-break: break-word; }
  .flow-connector { flex: 1; height: 2px; min-width: 20px; background: var(--border); margin-top: 21px; }
  .flow-connector--done { background: var(--success-border); }
  .flow-connector--warning { background: var(--warning-border); }

  .banner { padding: 0.8rem 1.1rem; border-radius: 10px; margin-bottom: 1.25rem; font-size: 0.88rem; border: 1px solid; line-height: 1.5; }
  .banner-ok { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  .banner-error { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }

  code { background: rgba(35, 38, 69, 0.07); color: #3a3d5c; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.85em; }
  pre.code-block {
    background: var(--bg-elevated-2);
    color: #2b2e4a;
    border: 1px solid var(--border);
    padding: 1rem;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 0.8rem;
    line-height: 1.6;
  }

  pre.diff-view { padding: 0.75rem 0; }
  pre.diff-view span { display: block; padding: 0.05rem 1rem; white-space: pre-wrap; word-break: break-word; }
  .diff-add { background: rgba(16, 185, 129, 0.14); color: var(--success-text); }
  .diff-remove { background: rgba(220, 38, 38, 0.12); color: var(--error-text); }
  .diff-hunk { color: var(--accent-blue); opacity: 0.85; }
  .diff-meta { color: var(--text-muted); font-weight: 600; }
  .diff-context { color: var(--text-muted); }

  .engine-fields { display: none; }
  .engine-fields.active { display: block; }
  .repo-fields { display: none; }
  .repo-fields.active { display: block; }

  a.pr-link { color: var(--accent-blue); font-weight: 600; text-decoration: none; }
  a.pr-link:hover { text-decoration: underline; }
  a { color: var(--accent-blue); }

  details { margin-top: 0.5rem; }
  details summary {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.4rem 0;
    user-select: none;
  }
  details summary:hover { color: var(--text); }
  details[open] summary { color: var(--text); margin-bottom: 0.25rem; }
</style>
</head>
<body>
  <header class="topband">
    <div class="topband-inner">
      <div class="brand">
        <svg class="brand-mark" width="26" height="26" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="color: var(--accent);">
          <circle cx="6" cy="16" r="2.6" fill="currentColor"/>
          <circle cx="16" cy="16" r="2.6" fill="currentColor"/>
          <circle cx="11" cy="6" r="2.6" fill="currentColor"/>
          <line x1="6" y1="16" x2="11" y2="6" stroke="currentColor" stroke-width="1.3" opacity="0.55"/>
          <line x1="16" y1="16" x2="11" y2="6" stroke="currentColor" stroke-width="1.3" opacity="0.55"/>
          <line x1="6" y1="16" x2="16" y2="16" stroke="currentColor" stroke-width="1.3" opacity="0.55"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">Driftbridge</span>
          <span class="brand-tagline">Bridges the drift between spec and code.</span>
        </div>
      </div>
      <nav>
        <a href="/ui/how-it-works" class="{{ 'active' if request.url.path == '/ui/how-it-works' else '' }}">How It Works</a>
        <a href="/ui/runs" class="{{ 'active' if request.url.path == '/ui/runs' else '' }}">Pipeline Runs</a>
        <a href="/ui/simulate" class="{{ 'active' if request.url.path == '/ui/simulate' else '' }}">Simulate Webhook</a>
        <a href="/ui/plan-sprint" class="{{ 'active' if request.url.path.startswith('/ui/plan-sprint') else '' }}">Plan a Sprint</a>
        <a href="/ui/jira-bugs" class="{{ 'active' if request.url.path.startswith('/ui/jira-bugs') else '' }}">Jira Bugs</a>
        <a href="/ui/config" class="{{ 'active' if request.url.path == '/ui/config' else '' }}">Configuration</a>
        <!-- request.state.username is set by ui/auth.py::current_username --
             every /ui/* route depends on it, so it's always present here.
             Undefined (renders as nothing) only on a page that somehow
             reached this layout without going through that dependency. This
             whole group is one flex row (align-items: center on nav handles
             vertical alignment against the padded tab links to its left) so
             the label+username and Sign out sit on the same baseline; the
             auto margin on the group pushes it to the right edge. -->
        <span style="margin-left: auto; display: flex; align-items: center; gap: 1rem;">
          {% if request.state.username %}<span style="color: var(--text-muted); font-size: 0.9rem;">User: {{ request.state.username }}</span>{% endif %}
          <!-- /logout is intercepted by Caddy (see Caddyfile.example) before it
               ever reaches this app -- it's not a route this app defines. Only
               does anything meaningful when accessed through Caddy's Basic Auth;
               a harmless dead link otherwise (e.g. a local `uvicorn --reload`). -->
          <a href="/logout" style="color: var(--text-muted); font-size: 0.9rem;" title="Force your browser to re-prompt for Basic Auth credentials">Sign out</a>
        </span>
      </nav>
    </div>
  </header>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
